name: BioGrow report cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean report header
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('<div class="printOnly"><b>${GROUP.name}</b><br>Kelas ${GROUP.kelas}<br>${GROUP.prodi} · ${GROUP.fak}<br>${GROUP.uni}<br>${GROUP.mk}<br>${GROUP.dosen.join(" · ")}</div>','',1)
          s=s.replace('<p><b>Identitas Kelompok Kuliah</b><br>${GROUP.members.join("<br>")}<br>${GROUP.prodi}, ${GROUP.fak}, ${GROUP.uni}<br>Dosen: ${GROUP.dosen.join("; ")}</p>','',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m "Remove group identity from report"
          git push
