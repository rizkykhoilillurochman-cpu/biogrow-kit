name: BioGrow one-shot cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove demo identity data and one-shot workflow
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('const KEY="biogrow-kit-v2";', 'const KEY="biogrow-kit-v3";', 1)
          old = 'if(state.identity&&(state.identity.name==="Ratna Efrida"||state.identity.kelas==="VII B"||state.identity.group==="3B")){state.identity=null;localStorage.removeItem(KEY);}'
          new = 'if(state.identity&&(state.identity.name==="Ratna Efrida"||state.identity.kelas==="VII B"||state.identity.group==="3B"||state.identity.plant==="Kacang hijau")){state.identity=null;localStorage.removeItem(KEY);}'
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')

      - name: Commit cleanup and remove this temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/biogrow-one-shot-cleanup.yml
          git add index.html .github/workflows/biogrow-one-shot-cleanup.yml
          if git diff --cached --quiet; then
            echo "No cleanup changes needed."
            exit 0
          fi
          git commit -m "Clean demo identity data"
          git push
