<style>
:root{--g:#1b5e20;--g2:#2e7d32;--lg:#81c784;--pale:#e8f5e9;--cream:#fafaf5;--soil:#5d4037;--note:#fff8c4;--ink:#18321c;--muted:#66756a;--white:#fff;--line:#dbe7dc;--shadow:0 12px 32px #17351d14}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:Poppins,sans-serif}.app{min-height:100vh}header{position:sticky;top:0;z-index:20;background:#fffffff2;backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}.nav{max-width:1180px;margin:auto;padding:12px 16px;display:flex;align-items:center;gap:14px}.logo{font:800 22px Montserrat;color:var(--soil);cursor:pointer;white-space:nowrap}.logo b{color:var(--g2)}.hamb{margin-left:auto;border:0;background:var(--pale);border-radius:12px;padding:9px 11px;font-size:20px}.links{display:none;gap:4px;flex-wrap:wrap}.links button{border:0;background:transparent;color:var(--muted);padding:8px 9px;border-radius:10px;font:600 12px Poppins;cursor:pointer}.links button:hover,.links .active{background:var(--pale);color:var(--g)}main{max-width:1180px;margin:auto;padding:22px 16px 70px}.page{display:none;animation:in .25s ease}.page.active{display:block}@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}.hero{background:linear-gradient(135deg,#e8f5e9,#fffdf2);border-radius:24px;padding:30px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow)}.hero:after{content:"🍃";position:absolute;right:18px;top:8px;font-size:80px;opacity:.15}.eyebrow{color:var(--g2);font-weight:700;letter-spacing:.08em;font-size:12px}.hero h1{font:800 clamp(34px,8vw,62px) Montserrat;margin:8px 0;color:var(--soil)}.hero h1 span{color:var(--g2)}.hero p{max-width:720px;color:#536258}.grid{display:grid;gap:14px}.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:1fr}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.feature .ico{font-size:30px}.feature h3{margin:10px 0 6px;font-size:16px}.muted{color:var(--muted);font-size:13px}.btn{border:0;border-radius:13px;padding:12px 16px;font:700 13px Poppins;cursor:pointer;transition:.2s;display:inline-flex;gap:7px;align-items:center;justify-content:center}.btn:hover{transform:translateY(-1px)}.primary{background:var(--g2);color:#fff}.secondary{background:var(--pale);color:var(--g)}.danger{background:#ffe9e9;color:#a52626}.outline{background:#fff;color:var(--g);border:1px solid var(--g2)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.section{margin-top:26px}.section>h2{font-size:22px}.kit{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.kit .card{text-align:center}.kit .big{font-size:42px}.flow{display:flex;gap:8px;overflow:auto;padding-bottom:4px}.flow .card{min-width:180px;text-align:center;flex:1}.about{background:var(--soil);color:#fff}.about .muted{color:#eaded9}.members{display:grid;gap:7px;font-size:13px}.progressWrap{max-width:1180px;margin:auto;padding:0 16px 8px}.progress{height:7px;background:#dfe9df;border-radius:9px;overflow:hidden}.progress i{display:block;height:100%;background:var(--g2);width:0;transition:.3s}label{display:block;font-size:12px;font-weight:700;margin:13px 0 6px}input,select,textarea{width:100%;border:1px solid #cfdcd0;border-radius:11px;padding:11px 12px;font:500 13px Poppins;background:#fff;color:var(--ink);outline:none}input:focus,select:focus,textarea:focus{border-color:var(--g2);box-shadow:0 0 0 3px #2e7d3215}textarea{min-height:100px;resize:vertical}.formgrid{display:grid;gap:12px}.stepper{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.step{min-width:105px;text-align:center;padding:10px;border-radius:12px;background:#edf3ed;color:var(--muted);font-size:11px;font-weight:700}.step.on{background:var(--g2);color:#fff}.illus{font-size:75px;text-align:center;padding:16px}.weekTabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.weekTabs button{padding:10px;border:0;border-radius:11px;background:#edf3ed;font:700 12px Poppins;color:var(--muted)}.weekTabs button.on{background:var(--g2);color:#fff}.weekTabs button.done{background:var(--lg);color:#174d1b}.preview{max-height:250px;max-width:100%;object-fit:contain;border-radius:13px;margin-top:8px;display:none}.measure{background:linear-gradient(#dff4ff 0 65%,#bde39b 65%);min-height:220px;border-radius:18px;position:relative;overflow:hidden;display:flex;align-items:end;justify-content:center}.pot{width:90px;height:65px;background:var(--soil);border-radius:8px 8px 25px 25px;margin-bottom:12px;position:relative}.plant{position:absolute;bottom:58px;width:8px;background:var(--g2);border-radius:8px;left:50%;transform:translateX(-50%);height:var(--ph,90px);transition:.4s}.plant:before,.plant:after{content:"";position:absolute;width:36px;height:17px;background:var(--g2);border-radius:100% 0;top:28px}.plant:before{right:5px;transform:rotate(25deg)}.plant:after{left:5px;transform:scaleX(-1) rotate(25deg)}.ruler{position:absolute;right:18%;bottom:75px;height:var(--ph,90px);border-left:3px dashed #fff}.ruler span{position:absolute;top:-8px;left:7px;background:#fff;padding:3px 7px;border-radius:7px;font-size:11px;font-weight:700}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:9px;border-bottom:1px solid var(--line);text-align:left}.chartBox{position:relative;height:280px}.gallery{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.gallery img{width:100%;height:170px;object-fit:cover;border-radius:12px}.note{background:var(--note);padding:14px;border-radius:12px;font-size:12px}.checks{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.checks label{margin:0;font-weight:500;background:#f7faf7;padding:8px;border-radius:9px}.checks input{width:auto}.report{background:#fff;max-width:900px;margin:auto;padding:25px;border-radius:6px;box-shadow:var(--shadow)}.report h1{text-align:center}.report h2{border-bottom:2px solid var(--g2);padding-bottom:6px;font-size:17px}.report .rphoto{max-width:220px;max-height:180px;object-fit:cover;margin:5px;border-radius:7px}.printOnly{display:none}.cameraModal{position:fixed;inset:0;background:#000;z-index:100;display:none}.cameraModal.on{display:block}.cameraModal video{width:100%;height:100%;object-fit:cover}.camOverlay{position:absolute;inset:0}.line{position:absolute;left:7%;right:7%;height:4px;background:#fff;border-radius:4px;box-shadow:0 0 0 1px #0008;touch-action:none}.line span{position:absolute;right:0;top:-25px;background:#fff;color:#111;padding:3px 8px;border-radius:6px;font-size:11px}.lTop{top:28%}.lBottom{top:70%}.camPanel{position:absolute;left:12px;right:12px;bottom:12px;background:#fffffff2;border-radius:16px;padding:12px}.camPanel .row{display:flex;gap:7px;align-items:center}.camPanel input{max-width:110px}.camStatus{font-size:12px;font-weight:700;margin-bottom:7px}.mobileNav{display:none;position:fixed;inset:auto 12px 12px;z-index:30;background:#fffffff5;border:1px solid var(--line);box-shadow:var(--shadow);border-radius:17px;padding:7px;gap:5px}.mobileNav button{flex:1;border:0;background:transparent;padding:7px;font-size:10px;font-weight:700;color:var(--muted);border-radius:10px}.mobileNav button.on{background:var(--pale);color:var(--g)}.toast{position:fixed;right:15px;bottom:15px;background:#17351d;color:#fff;padding:12px 15px;border-radius:12px;z-index:200;opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;font-size:12px}.toast.on{opacity:1;transform:none}@media(min-width:700px){.links{display:flex}.hamb,.mobileNav{display:none}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.formgrid{grid-template-columns:repeat(2,1fr)}.kit{grid-template-columns:repeat(4,1fr)}.gallery{grid-template-columns:repeat(4,1fr)}main{padding-top:30px}.hero{padding:45px}}@media(max-width:699px){.mobileNav{display:flex}body{padding-bottom:70px}.hero{padding:25px 18px}.links.open{display:grid;position:absolute;top:64px;left:10px;right:10px;background:#fff;padding:10px;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.links.open button{text-align:left}.nav{position:relative}}@media print{body{background:#fff}.app>header,.progressWrap,.mobileNav,.toast,.actions,.noPrint{display:none!important}main{padding:0;max-width:none}.page{display:none!important}.page#page-report{display:block!important}.report{box-shadow:none;padding:0;max-width:none}.printOnly{display:block}.report section{break-inside:avoid}.report img,.report canvas{max-width:100%;break-inside:avoid}}
</style>
</head>
<body><div class="app"><header><div class="nav"><div class="logo" onclick="go('home')">🍃 Bio<b>Grow</b> Kit</div><button class="hamb" onclick="toggleMenu()">☰</button><div class="links" id="links"></div></div><div class="progressWrap"><div class="progress"><i id="bar"></i></div></div></header><main id="main"></main><div class="mobileNav" id="mobileNav"></div></div>
<div class="cameraModal" id="cam"><video id="video" playsinline autoplay muted></video><canvas id="snap" hidden></canvas><div class="camOverlay"><div class="line lTop" id="lt"><span>pucuk / referensi atas</span></div><div class="line lBottom" id="lb"><span>pangkal / referensi bawah</span></div></div><div class="camPanel"><div class="camStatus" id="camStatus">Tempatkan dua garis pada benda referensi.</div><div class="row"><label style="margin:0">Referensi cm<input id="refCm" type="number" value="8" min=".1" step=".1"></label><button class="btn outline" onclick="calibrate()">📐 Kalibrasi</button><button class="btn secondary" onclick="calculateMeasure()">📏 Hitung</button><button class="btn primary" onclick="takePhoto()">📸 Ambil Foto</button><button class="btn primary" onclick="useMeasure()">✓ Pakai hasil</button><button class="btn danger" onclick="closeCam()">Tutup</button></div><label style="margin-top:8px">Jika kamera gagal: <input type="file" id="photoFallback" accept="image/*" capture="environment" onchange="fallbackPhoto(this)"></label></div></div><div class="toast" id="toast"></div>
<script>
const GROUP={name:"BIO GROW KIT",kelas:"B",members:["Kurnia Nurfitria - 2513024022","Pinkan Shepianti Ivanka - 2553024002","Salsabila Gizca Naysilla Putri - 2513024056","Ratna Efrida - 2513024062"],prodi:"Pendidikan Biologi",fak:"Keguruan dan Ilmu Pendidikan",uni:"Universitas Lampung",mk:"Kewirausahaan",dosen:["Rini Rita T. Marpaung, S.Pd., M.Pd.","Mufidah Estu Kinasih, M.Pd."]};
const KEY="biogrow-kit-v3";let state=JSON.parse(localStorage.getItem(KEY)||"null")||{identity:null,weeks:[null,null,null,null],analysis:{q1:"",q2:"",q3:"",factors:[],explain:""},conclusion:{a:"",b:""},reflection:["","","","",""],qr:location.href};let page="home",week=0,guide=0,webStep=0,charts={},stream=null,measure={refPx:null,refCm:8,value:null,photo:null};
const nav=[["identity","Identitas"],["guide","Panduan"],["observe","Pengamatan"],["analysis","Analisis"],["webar","WebAR"],["qr","QR Code"],["conclusion","Kesimpulan"],["reflection","Refleksi"],["result","Hasil Proyek"],["report","Laporan"]];
function save(){localStorage.setItem(KEY,JSON.stringify(state));renderProgress()}function toast(t){let x=document.getElementById("toast");x.textContent=t;x.classList.add("on");setTimeout(()=>x.classList.remove("on"),2200)}function go(p){if(p!=="home"&&!state.identity&&p!=="identity"){toast("Isi identitas dulu untuk memulai.");p="identity"}page=p;render();scrollTo(0,0)}function toggleMenu(){document.getElementById("links").classList.toggle("open")}
function done(p){if(p==="identity")return !!state.identity;if(p==="guide")return guide>=4;if(p==="observe")return state.weeks.every(Boolean);if(p==="analysis")return !!(state.analysis.q1||state.analysis.q2||state.analysis.q3);if(p==="conclusion")return !!(state.conclusion.a&&state.conclusion.b);if(p==="reflection")return state.reflection.every(x=>x.trim());if(p==="result")return state.weeks.some(Boolean);return false}function progress(){let n=(state.identity?1:0)+(guide>=4?1:0)+state.weeks.filter(Boolean).length+(done("analysis")?1:0)+(done("conclusion")?1:0)+(done("reflection")?1:0);return Math.round(n/10*100)}function renderProgress(){let b=document.getElementById("bar");if(b)b.style.width=progress()+"%"}function navHtml(){return nav.map(([id,t])=>`<button class="${page===id?"active":""}" onclick="go('${id}')">${done(id)?"✓":"○"} ${t}</button>`).join("")}
function render(){document.getElementById("links").innerHTML=navHtml();document.getElementById("mobileNav").innerHTML=[["home","⌂","Beranda"],["observe","🌱","Amati"],["analysis","📊","Analisis"],["webar","📷","WebAR"],["result","📄","Hasil"]].map(x=>`<button class="${page===x[0]?"on":""}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join("");document.getElementById("main").innerHTML=pageHtml();renderProgress();afterRender()}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function pageHtml(){switch(page){case"home":return home();case"identity":return identity();case"guide":return guidePage();case"observe":return observe();case"analysis":return analysis();case"webar":return webar();case"qr":return qr();case"conclusion":return conclusion();case"reflection":return reflection();case"result":return result();case"report":return report();default:return home()}}
function home(){return `<section class="page active"><div class="hero"><div class="eyebrow">PROYEK PENGAMATAN PERTUMBUHAN TANAMAN</div><h1>BIO<span>GROW</span> KIT</h1><h3>Tanam, Jelajahi, Pelajari, Tumbuh Bersama!</h3><p>Prototipe kit menanam interaktif dengan dukungan WebAR. Bukan sekadar pencatat tinggi tanaman, tetapi alur proyek yang membimbing pengamatan ilmiah selama 4 minggu.</p><div class="actions"><button class="btn primary" onclick="go('identity')">🌱 Mulai Proyek</button><button class="btn secondary" onclick="go('webar')">📷 Jelajahi WebAR</button></div></div><div class="section"><h2>Kenapa BioGrow Kit?</h2><div class="grid grid4">${[["📚","Panduan interaktif","Belajar menanam langkah demi langkah."],["📏","Simulasi pengukuran","Ukur tinggi tanaman dengan kamera dan kalibrasi."],["💧","Perawatan tanaman","Informasi cahaya, air, media, dan panen."],["📱","WebAR tanpa instalasi","Akses dari browser melalui QR Code."]].map(x=>`<div class="card feature"><div class="ico">${x[0]}</div><h3>${x[1]}</h3><div class="muted">${x[2]}</div></div>`).join("")}</div></div><div class="section"><h2>Isi Kit</h2><div class="kit">${[["🪴","Pot","Biodegradable"],["🌱","Media Tanam","Organik"],["🫘","Biji","Kacang hijau"],["▣","QR Code","Akses WebAR"]].map(x=>`<div class="card"><div class="kit big">${x[0]}</div><b>${x[1]}</b><div class="muted">${x[2]}</div></div>`).join("")}</div></div><div class="section"><h2>Alur Penggunaan</h2><div class="flow">${[["📷","Scan QR"],["🌐","WebAR terbuka"],["🪴","Ikuti panduan"],["📈","Pantau & simulasi"]].map((x,i)=>`<div class="card"><div class="kit big">${x[0]}</div><b>${i+1}. ${x[1]}</b></div>`).join("")}</div></div><div class="section card about"><h2>Tentang Kami</h2><div class="members"><b>Nama Kelompok: ${GROUP.name} · Kelas ${GROUP.kelas}</b>${GROUP.members.map(x=>`<div>${x}</div>`).join("")}<div>${GROUP.prodi} · ${GROUP.fak}</div><div>${GROUP.uni} · ${GROUP.mk}</div><div>Dosen: ${GROUP.dosen.join("; ")}</div></div></div></section>`}
function identity(){let x=state.identity||{};return `<section class="page active"><div class="card"><div class="eyebrow">LANGKAH 1</div><h2>Identitas Proyek</h2><p class="muted">Isi data peserta. Semua kolom wajib.</p><div class="formgrid"><div><label>Nama</label><input id="idName" value="${esc(x.name)}" placeholder="Masukkan nama"></div><div><label>Kelas</label><input id="idClass" value="${esc(x.kelas)}" placeholder="Masukkan kelas"></div><div><label>Kelompok</label><input id="idGroup" value="${esc(x.group)}" placeholder="Masukkan kelompok"></div><div><label>Nama tanaman</label><input id="idPlant" value="${esc(x.plant)}" placeholder="Masukkan nama tanaman"></div><div><label>Tanggal mulai</label><input id="idDate" type="date" value="${esc(x.date)}"></div></div><div class="actions"><button class="btn primary" onclick="saveIdentity()">Simpan & Mulai Proyek →</button><button class="btn danger" onclick="resetAll()">Reset Proyek</button></div></div></section>`}
function saveIdentity(){let vals=["idName","idClass","idGroup","idPlant","idDate"].map(id=>document.getElementById(id).value.trim());if(vals.some(x=>!x)){toast("Lengkapi semua identitas.");return}state.identity={name:vals[0],kelas:vals[1],group:vals[2],plant:vals[3],date:vals[4]};save();toast("Identitas tersimpan.");go("guide")}
function guidePage(){let steps=[["🪴","Menanam","Siapkan media, isi pot sekitar 3/4 bagian, masukkan benih sesuai petunjuk, lalu letakkan di tempat yang sesuai."],["💧","Merawat","Siram sesuai kebutuhan dan pastikan tanaman mendapat cukup cahaya."],["👀","Mengamati","Amati pertumbuhan satu kali setiap minggu selama 4 minggu."],["📝","Mencatat","Masukkan hasil pengamatan ke BioGrow Kit setiap minggu."],["📊","Menganalisis","Setelah minggu ke-4, gunakan data untuk melihat perubahan pertumbuhan."]];let s=steps[guide];return `<section class="page active"><div class="card"><div class="stepper">${steps.map((x,i)=>`<div class="step ${i===guide?"on":""}">Langkah ${i+1}</div>`).join("")}</div><div class="illus">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p><div class="actions"><button class="btn secondary" ${guide===0?"disabled":""} onclick="guide=Math.max(0,guide-1);render()">← Sebelumnya</button>${guide<4?`<button class="btn primary" onclick="guide++;render()">Lanjut →</button>`:`<button class="btn primary" onclick="go('observe')">Mulai Pengamatan Minggu 1 →</button>`}</div></div></section>`}
function observe(){let w=state.weeks[week]||{},locked=week>0&&!state.weeks[week-1];return `<section class="page active"><div class="card"><h2>Pengamatan Mingguan</h2><p class="muted">Amati sekali setiap minggu. Minggu berikutnya terbuka setelah data sebelumnya disimpan.</p><div class="weekTabs">${[0,1,2,3].map(i=>`<button class="${week===i?"on":""} ${state.weeks[i]?"done":""}" ${i>0&&!state.weeks[i-1]?"disabled":""} onclick="week=${i};render()">Minggu ${i+1} ${state.weeks[i]?"✓":i>0&&!state.weeks[i-1]?"🔒":"○"}</button>`).join("")}</div>${locked?`<div class="note" style="margin-top:15px">🔒 Simpan Minggu ${week} terlebih dahulu untuk membuka Minggu ${week+1}.</div>`:`<div class="formgrid"><div><label>Tanggal pengamatan</label><input id="odate" type="date" value="${esc(w.date||"")}"></div><div><label>Tinggi tanaman (cm)</label><input id="height" type="number" min="0" step=".1" value="${w.height??""}" oninput="drawMeasure(this.value)" placeholder="Contoh 12.5"></div><div><label>Jumlah daun</label><input id="leaves" type="number" min="0" step="1" value="${w.leaves??""}" placeholder="Contoh 4"></div><div><label>Kondisi tanaman</label><select id="condition" onchange="toggleOther()">${["Sehat","Layu","Daun menguning","Pertumbuhan lambat","Lainnya"].map(x=>`<option ${w.condition===x?"selected":""}>${x}</option>`).join("")}</select><input id="other" style="display:none;margin-top:7px" placeholder="Tulis kondisi lain" value="${esc(w.other||"")}"></div><div><label>Foto tanaman</label><input id="photo" type="file" accept="image/*" capture="environment" onchange="compressPhoto(this)"><img id="preview" class="preview" src="${w.photo||""}" style="${w.photo?"display:block":""}"></div><div><label>Catatan pengamatan</label><textarea id="notes">${esc(w.notes||"")}</textarea></div></div><div class="card" style="margin-top:14px;background:#f7fbf7"><b>Simulasi Pengukuran</b><div class="measure" style="margin-top:10px"><div class="plant" id="simPlant"><span></span></div><div class="pot"></div><div class="ruler" id="ruler"><span id="rulerText">${w.height||0} cm</span></div></div><div class="actions"><button class="btn secondary" onclick="openCam()">📷 Ukur dengan Kamera (AR)</button><button class="btn primary" onclick="saveWeek()">Simpan Pengamatan</button>${week<3&&state.weeks[week]?`<button class="btn outline" onclick="week++;render()">Lanjut Minggu ${week+2} →</button>`:""}${week===3&&state.weeks[3]?`<button class="btn primary" onclick="go('analysis')">Lihat Analisis →</button>`:""}</div></div>`}</div></section>`}
function toggleOther(){let s=document.getElementById("condition"),o=document.getElementById("other");if(s)o.style.display=s.value==="Lainnya"?"block":"none"}function drawMeasure(v){let n=Math.max(0,Number(v)||0),h=Math.min(160,35+n*8);let p=document.getElementById("simPlant"),r=document.getElementById("ruler");if(p)p.style.setProperty("--ph",h+"px");if(r)r.style.setProperty("--ph",h+"px");let t=document.getElementById("rulerText");if(t)t.textContent=n+" cm"}
function saveWeek(){let date=document.getElementById("odate").value,height=Number(document.getElementById("height").value),leaves=Number(document.getElementById("leaves").value),condition=document.getElementById("condition").value;if(!date||!Number.isFinite(height)||height<0||!Number.isFinite(leaves)||leaves<0){toast("Tanggal, tinggi dan jumlah daun wajib valid.");return}let other=document.getElementById("other").value.trim(),photo=document.getElementById("preview").src||"";state.weeks[week]={date,height,leaves,condition,other,photo,notes:document.getElementById("notes").value};save();toast("Minggu "+(week+1)+" tersimpan.");render()}
function compressPhoto(inp){let f=inp.files[0];if(!f)return;let img=new Image,reader=new FileReader;reader.onload=e=>{img.onload=()=>{let c=document.createElement("canvas"),scale=Math.min(1,800/img.width);c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);c.getContext("2d").drawImage(img,0,0,c.width,c.height);let src=c.toDataURL("image/jpeg",.78),p=document.getElementById("preview");p.src=src;p.style.display="block"};img.src=e.target.result};reader.readAsDataURL(f)}
function analysis(){if(!state.weeks.every(Boolean))return `<section class="page active"><div class="card"><h2>Analisis</h2><div class="note">Lengkapi dan simpan pengamatan Minggu 1–4 terlebih dahulu.</div><div class="actions"><button class="btn primary" onclick="go('observe')">Kembali ke Pengamatan</button></div></div></section>`;let ws=state.weeks,d=ws[3].height-ws[0].height,deltas=ws.slice(1).map((x,i)=>x.height-ws[i].height),max=Math.max(...deltas),mi=deltas.indexOf(max),phrase=d<0?`tinggi tanaman berkurang sebesar ${Math.abs(d).toFixed(1)} cm`:d===0?`tinggi tanaman tidak berubah`:`tinggi tanaman bertambah sebesar ${d.toFixed(1)} cm`;return `<section class="page active"><div class="card"><h2>Analisis Data</h2><p>Tanaman mengalami ${phrase} selama 4 minggu.</p><p class="muted">Pertambahan: M1→M2 ${fmt(deltas[0])}; M2→M3 ${fmt(deltas[1])}; M3→M4 ${fmt(deltas[2])}.</p><div class="note">📌 Pertambahan terbesar terjadi pada Minggu ${mi+1} ke Minggu ${mi+2}.</div><div class="grid grid3" style="margin-top:15px"><div class="card"><b>Grafik Tinggi</b><div class="chartBox"><canvas id="heightChart"></canvas></div></div><div class="card"><b>Grafik Daun</b><div class="chartBox"><canvas id="leafChart"></canvas></div></div><div class="card"><b>Rekap</b><table class="table"><tr><th>Minggu</th><th>Tgl</th><th>cm</th><th>Daun</th><th>Kondisi</th></tr>${ws.map((w,i)=>`<tr><td>${i+1}</td><td>${w.date}</td><td>${w.height}</td><td>${w.leaves}</td><td>${esc(w.condition==="Lainnya"?w.other:w.condition)}</td></tr>`).join("")}</table></div></div></div><div class="card section"><h3>Simulasi Pertumbuhan</h3><input type="range" min="0" max="3" value="0" oninput="growthSim(this.value)"><div class="measure"><div class="plant" id="growthPlant"></div><div class="pot"></div><div class="ruler"><span id="growthText">${ws[0].height} cm</span></div></div><div class="note">“Dari biji menjadi harapan yang tumbuh nyata”</div></div><div class="card section"><h3>Pertanyaan Analisis</h3><label>1) Berapa pertambahan tinggi tanaman selama 4 minggu?</label><textarea id="aq1">${esc(state.analysis.q1)}</textarea><label>2) Pada minggu berapa tanaman mengalami pertumbuhan paling besar?</label><textarea id="aq2">${esc(state.analysis.q2)}</textarea><label>3) Apa yang menyebabkan tanaman mengalami perubahan tersebut?</label><div class="checks">${["air","cahaya","nutrisi","media tanam","perawatan","lingkungan"].map(x=>`<label><input type="checkbox" value="${x}" ${state.analysis.factors.includes(x)?"checked":""}> ${x}</label>`).join("")}</div><textarea id="aq3" style="margin-top:8px">${esc(state.analysis.q3)}</textarea><label>Penjelasan</label><textarea id="aex">${esc(state.analysis.explain)}</textarea><div class="actions"><button class="btn primary" onclick="saveAnalysis()">Simpan Analisis</button><button class="btn secondary" onclick="go('conclusion')">Lanjut Kesimpulan →</button></div></div></section>`}
function fmt(n){return(n>=0?"+":"")+n.toFixed(1)+" cm"}function afterRender(){toggleOther();if(page==="observe"&&state.weeks[week])drawMeasure(state.weeks[week].height);if(page==="analysis")setTimeout(drawCharts,30);if(page==="report")setTimeout(drawReportChart,30);if(page==="qr")setTimeout(drawQR,30);if(page==="webar"&&webStep===2)detectXR()}
function drawCharts(){if(!window.Chart)return;Object.values(charts).forEach(c=>c?.destroy());let labs=["Minggu 1","Minggu 2","Minggu 3","Minggu 4"],h=state.weeks.map(x=>x.height),l=state.weeks.map(x=>x.leaves);charts.height=new Chart(document.getElementById("heightChart"),{type:"line",data:{labels:labs,datasets:[{label:"Tinggi (cm)",data:h,borderWidth:3,tension:.3,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false}});charts.leaves=new Chart(document.getElementById("leafChart"),{type:"bar",data:{labels:labs,datasets:[{label:"Jumlah daun",data:l}]},options:{responsive:true,maintainAspectRatio:false}})}function growthSim(i){let w=state.weeks[i];if(!w)return;let h=Math.min(160,35+w.height*8),p=document.getElementById("growthPlant");if(p)p.style.setProperty("--ph",h+"px");let t=document.getElementById("growthText");if(t)t.textContent=w.height+" cm"}
function saveAnalysis(){state.analysis.q1=document.getElementById("aq1").value;state.analysis.q2=document.getElementById("aq2").value;state.analysis.q3=document.getElementById("aq3").value;state.analysis.explain=document.getElementById("aex").value;state.analysis.factors=[...document.querySelectorAll(".checks input:checked")].map(x=>x.value);save();toast("Analisis tersimpan.")}
function webar(){let steps=[["📷","Scan QR Code","Scan QR pada kit. Web akan terbuka langsung di browser tanpa instalasi."],["🪴","Panduan Interaktif","Isi pot 3/4 bagian dengan tanah, tanam benih, siram, dan letakkan di tempat terang."],["📏","Ukur Tinggi Tanaman","Mode kamera + penggaris kalibrasi bekerja di Android dan iPhone. WebXR AR penuh hanya muncul jika didukung perangkat."],["🌱","Informasi Tanaman","Kacang hijau (Vigna radiata): cahaya 4–6 jam/hari, penyiraman 1–2 kali/hari, media gembur kaya nutrisi, panen ±25–30 hari."]],s=steps[webStep];return `<section class="page active"><div class="card"><div class="stepper">${steps.map((x,i)=>`<div class="step ${i===webStep?"on":""}">Tahap ${i+1}</div>`).join("")}</div><div class="illus">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p>${webStep===2?`<div class="note">⚠️ Fitur kamera membutuhkan website dibuka lewat HTTPS (mis. GitHub Pages/Netlify) atau localhost.</div><div class="actions"><button class="btn primary" onclick="openCam()">📷 Kamera + Penggaris Kalibrasi</button><button id="xrBtn" class="btn secondary" style="display:none" onclick="webXR()">🥽 Ukur dengan AR Penuh</button></div>`:""}${webStep===3?`<div class="grid grid3"><div class="card">☀️ <b>Cahaya</b><br>4–6 jam/hari</div><div class="card">💧 <b>Air</b><br>1–2 kali/hari</div><div class="card">🌿 <b>Media</b><br>Gembur & kaya nutrisi</div><div class="card">📅 <b>Panen</b><br>±25–30 hari</div></div><div class="note" style="margin-top:12px">Tanaman yang dirawat dengan baik akan tumbuh lebih optimal!</div>`:""}<div class="actions">${webStep>0?`<button class="btn secondary" onclick="webStep--;render()">← Sebelumnya</button>`:""}${webStep<3?`<button class="btn primary" onclick="webStep++;render()">Lanjut →</button>`:`<button class="btn primary" onclick="go('observe')">Mulai Pengamatan →</button>`}</div></div></section>`}
async function detectXR(){let b=document.getElementById("xrBtn");try{if(navigator.xr&&await navigator.xr.isSessionSupported("immersive-ar"))b.style.display="inline-flex"}catch(e){}}async function webXR(){toast("WebXR AR penuh memerlukan perangkat/browser yang mendukung hit-test. Mode kamera tetap tersedia.")}
function qr(){return `<section class="page active"><div class="card"><h2>QR Code Kit</h2><p class="muted">QR otomatis mengikuti URL website. Saat sudah online, ganti dengan link hosting asli.</p><label>URL website</label><input id="qrUrl" value="${esc(state.qr||location.href)}" oninput="state.qr=this.value;save();drawQR()"><div id="qrcode" style="padding:20px;display:flex;justify-content:center"></div><div class="actions"><button class="btn primary" onclick="downloadQR()">⬇️ Unduh QR (PNG)</button><button class="btn secondary" onclick="printQR()">🖨️ Cetak Label QR</button></div><div id="qrLabel" style="background:#fff;padding:18px;text-align:center;max-width:330px;margin:18px auto;border:1px solid #ddd;border-radius:15px"><b>🍃 Jelajahi dengan WebAR</b><div id="qrPrint"></div><small>Scan untuk mulai petualangan!</small></div></div></section>`}function drawQR(){let q=document.getElementById("qrcode"),p=document.getElementById("qrPrint");if(!q)return;q.innerHTML="";let url=document.getElementById("qrUrl")?.value||state.qr||location.href;new QRCode(q,{text:url,width:220,height:220,colorDark:"#1B5E20",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});if(p){p.innerHTML="";new QRCode(p,{text:url,width:180,height:180})}}function downloadQR(){let img=document.querySelector("#qrcode img");if(!img){toast("QR belum siap.");return}let a=document.createElement("a");a.href=img.src;a.download="biogrow-kit-qr.png";a.click()}function printQR(){let w=window.open("","_blank");w.document.write(`<html><head><title>BioGrow QR</title><style>body{text-align:center;font-family:Arial;padding:30px}#qrPrint{margin:20px auto;width:180px}</style></head><body><h2>🍃 Jelajahi dengan WebAR</h2><div id="qrPrint"></div><b>Scan untuk mulai petualangan!</b><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"><\/script><script>new QRCode(document.getElementById("qrPrint"),{text:${JSON.stringify(state.qr||location.href)},width:180,height:180});setTimeout(()=>print(),500)<\/script></body></html>`);w.document.close()}
function conclusion(){return `<section class="page active"><div class="card"><h2>Kesimpulan</h2><p class="muted">Jawaban harus berdasarkan data yang diperoleh.</p><label>A. Berdasarkan hasil pengamatan selama 4 minggu, bagaimana pertumbuhan tanaman yang diamati?</label><textarea id="ca">${esc(state.conclusion.a)}</textarea><label>B. Apa yang kamu pelajari dari proyek ini?</label><textarea id="cb">${esc(state.conclusion.b)}</textarea><div class="actions"><button class="btn primary" onclick="saveConclusion()">Simpan Kesimpulan</button><button class="btn secondary" onclick="go('reflection')">Lanjut Refleksi →</button></div></div></section>`}function saveConclusion(){state.conclusion.a=document.getElementById("ca").value.trim();state.conclusion.b=document.getElementById("cb").value.trim();if(!state.conclusion.a||!state.conclusion.b){toast("Kedua jawaban wajib diisi.");return}save();toast("Kesimpulan tersimpan.")}
function reflection(){let qs=["Apa hal baru yang kamu pelajari selama proyek?","Apa kendala yang kamu alami selama menanam dan mengamati tanaman?","Bagaimana cara kamu mengatasi kendala tersebut?","Bagaimana kerja sama kelompok selama proyek?","Apa yang akan kamu lakukan lebih baik jika proyek ini dilakukan kembali?"];return `<section class="page active"><div class="card"><h2>Refleksi</h2>${qs.map((q,i)=>`<label>${i+1}) ${q}</label><textarea id="rf${i}">${esc(state.reflection[i])}</textarea>`).join("")}<div class="actions"><button class="btn primary" onclick="saveReflection()">Simpan Refleksi</button><button class="btn secondary" onclick="go('result')">Lihat Hasil Proyek →</button></div></div></section>`}function saveReflection(){state.reflection=[0,1,2,3,4].map(i=>document.getElementById("rf"+i).value.trim());if(state.reflection.some(x=>!x)){toast("Semua refleksi wajib diisi.");return}save();toast("Refleksi tersimpan.")}
function result(){return `<section class="page active"><div class="card"><h2>Hasil Proyek</h2>${!state.identity?`<div class="note">Belum ada identitas proyek.</div>`:`<div class="grid grid3"><div class="card"><b>Peserta</b><br>${esc(state.identity.name)}<br>${esc(state.identity.kelas)} · Kelompok ${esc(state.identity.group)}</div><div class="card"><b>Tanaman</b><br>${esc(state.identity.plant)}<br>Mulai ${esc(state.identity.date)}</div><div class="card"><b>Progres</b><br><strong>${progress()}%</strong></div></div><h3>Data Pengamatan</h3><table class="table"><tr><th>Minggu</th><th>Tanggal</th><th>Tinggi</th><th>Daun</th><th>Kondisi</th></tr>${state.weeks.map((w,i)=>`<tr><td>${i+1}</td><td>${w?.date||"—"}</td><td>${w?w.height+" cm":"—"}</td><td>${w?.leaves??"—"}</td><td>${w?esc(w.condition==="Lainnya"?w.other:w.condition):"—"}</td></tr>`).join("")}</table><h3>Galeri Foto</h3><div class="gallery">${state.weeks.map((w,i)=>w?.photo?`<div><img src="${w.photo}"><small>Minggu ${i+1}</small></div>`:"").join("")||"<span class='muted'>Belum ada foto.</span>"}</div><div class="actions"><button class="btn primary" onclick="go('report')">📄 Lihat Hasil & Buat Laporan</button></div></div>`}</section>`}
function report(){let ws=state.weeks,d=ws.every(Boolean)?ws[3].height-ws[0].height:null;return `<section class="page active" id="page-report"><div class="report"><div class="printOnly"><b>${GROUP.name}</b><br>Kelas ${GROUP.kelas}<br>${GROUP.prodi} · ${GROUP.fak}<br>${GROUP.uni}<br>${GROUP.mk}<br>${GROUP.dosen.join(" · ")}</div><h1>Laporan Proyek BioGrow Kit</h1><p style="text-align:center">Proyek Pengamatan Pertumbuhan Tanaman</p><hr><section><h2>1. Identitas</h2><p>Nama: <b>${esc(state.identity?.name||"—")}</b><br>Kelas: ${esc(state.identity?.kelas||"—")} · Kelompok: ${esc(state.identity?.group||"—")}<br>Tanaman: ${esc(state.identity?.plant||"—")}<br>Tanggal mulai: ${esc(state.identity?.date||"—")}</p><p><b>Identitas Kelompok Kuliah</b><br>${GROUP.members.join("<br>")}<br>${GROUP.prodi}, ${GROUP.fak}, ${GROUP.uni}<br>Dosen: ${GROUP.dosen.join("; ")}</p></section><section><h2>2. Tujuan Proyek</h2><p>Proyek ini bertujuan mengamati pertumbuhan tanaman secara sistematis selama empat minggu melalui kegiatan menanam, merawat, mengukur, mencatat, membandingkan, menganalisis, menyimpulkan, merefleksikan, melaporkan, dan mempresentasikan hasil.</p></section><section><h2>3. Pertanyaan Proyek</h2><ol><li>Bagaimana perubahan tinggi tanaman selama empat minggu?</li><li>Pada minggu berapa pertumbuhan paling besar terjadi?</li><li>Faktor apa yang berkaitan dengan perubahan pertumbuhan tanaman?</li></ol></section><section><h2>4. Proses Penanaman</h2><p>Media tanam disiapkan dalam pot sekitar tiga perempat bagian, benih ditanam sesuai petunjuk, tanaman disiram sesuai kebutuhan dan ditempatkan pada kondisi cahaya yang sesuai. Pengamatan dilakukan satu kali setiap minggu selama empat minggu.</p></section><section><h2>5. Data Pengamatan</h2><table class="table"><tr><th>Minggu</th><th>Tanggal</th><th>Tinggi</th><th>Daun</th><th>Kondisi</th><th>Catatan</th></tr>${ws.map((w,i)=>`<tr><td>${i+1}</td><td>${w?.date||"—"}</td><td>${w?w.height+" cm":"—"}</td><td>${w?.leaves??"—"}</td><td>${w?esc(w.condition==="Lainnya"?w.other:w.condition):"—"}</td><td>${esc(w?.notes||"—")}</td></tr>`).join("")}</table></section><section><h2>6. Foto Perkembangan</h2>${ws.map((w,i)=>w?.photo?`<div style="display:inline-block;text-align:center"><img class="rphoto" src="${w.photo}"><br>Minggu ${i+1}</div>`:"").join("")||"<p>Belum ada foto.</p>"}</section><section><h2>7. Grafik</h2><div class="chartBox"><canvas id="reportChart"></canvas></div></section><section><h2>8. Hasil Analisis</h2><p>${d===null?"Data empat minggu belum lengkap.":d<0?`Tinggi tanaman berkurang ${Math.abs(d).toFixed(1)} cm selama empat minggu.`:`Tinggi tanaman bertambah ${d.toFixed(1)} cm selama empat minggu.`}</p><p>${esc(state.analysis.q1||"Belum diisi.")}</p><p>${esc(state.analysis.q2||"Belum diisi.")}</p><p>${esc(state.analysis.q3||"Belum diisi.")}</p><p>Faktor: ${esc(state.analysis.factors.join(", ")||"Belum dipilih.")}. ${esc(state.analysis.explain)}</p></section><section><h2>9. Kesimpulan</h2><p>${esc(state.conclusion.a||"Belum diisi.")}</p><p>${esc(state.conclusion.b||"Belum diisi.")}</p></section><section><h2>10. Refleksi</h2><ol>${state.reflection.map(x=>`<li>${esc(x||"Belum diisi.")}</li>`).join("")}</ol></section><div class="actions noPrint"><button class="btn primary" onclick="window.print()">🖨️ Cetak / Simpan PDF</button></div></div></section>`}
function drawReportChart(){let c=document.getElementById("reportChart");if(!c||!window.Chart||!state.weeks.every(Boolean))return;new Chart(c,{type:"line",data:{labels:["Minggu 1","Minggu 2","Minggu 3","Minggu 4"],datasets:[{label:"Tinggi (cm)",data:state.weeks.map(x=>x.height),borderWidth:3,tension:.3,pointRadius:5}]},options:{responsive:true,maintainAspectRatio:false}})}
function resetAll(){if(confirm("Reset semua data proyek? Data yang tersimpan akan dihapus.")){localStorage.removeItem(KEY);location.reload()}}
async function openCam(){if(!window.isSecureContext){toast("Kamera membutuhkan HTTPS atau localhost.");return}document.getElementById("cam").classList.add("on");measure={refPx:null,refCm:Number(document.getElementById("refCm").value)||8,value:null,photo:null};try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});document.getElementById("video").srcObject=stream;document.getElementById("camStatus").textContent="Tempatkan garis pada benda referensi (mis. pot 8 cm), lalu tekan Kalibrasi.";enableDrag("lt");enableDrag("lb")}catch(e){document.getElementById("camStatus").textContent="Kamera tidak tersedia/ditolak. Gunakan upload foto di bawah."}}
function enableDrag(id){let el=document.getElementById(id),drag=false;el.onpointerdown=()=>{drag=true};window.addEventListener("pointerup",()=>drag=false);window.addEventListener("pointermove",e=>{if(!drag)return;let y=e.clientY;el.style.top=Math.max(5,Math.min(90,y/window.innerHeight*100))+"%"})}
function calibrate(){let t=parseFloat(getComputedStyle(document.getElementById("lt")).top),b=parseFloat(getComputedStyle(document.getElementById("lb")).top);measure.refPx=Math.abs(b-t)*window.innerHeight/100;measure.refCm=Number(document.getElementById("refCm").value)||8;if(!measure.refPx){toast("Jarak garis belum valid.");return}document.getElementById("camStatus").textContent="Kalibrasi tersimpan. Sekarang geser garis ke pucuk dan pangkal tanaman, lalu tekan Hitung."}
function calculateMeasure(){if(!measure.refPx){toast("Tekan Kalibrasi saat garis berada pada benda referensi.");return}let t=parseFloat(document.getElementById("lt").style.top)||parseFloat(getComputedStyle(document.getElementById("lt")).top),b=parseFloat(document.getElementById("lb").style.top)||parseFloat(getComputedStyle(document.getElementById("lb")).top),px=Math.abs(b-t)*window.innerHeight/100;measure.value=+(px/measure.refPx*measure.refCm).toFixed(1);document.getElementById("camStatus").textContent="Tinggi terukur: "+measure.value+" cm. Tekan Ambil Foto lalu Pakai hasil."}
function takePhoto(){let v=document.getElementById("video"),c=document.getElementById("snap");if(!v.videoWidth){toast("Kamera belum siap.");return}c.hidden=false;c.width=v.videoWidth;c.height=v.videoHeight;let ctx=c.getContext("2d");ctx.drawImage(v,0,0);for(const id of ["lt","lb"]){let el=document.getElementById(id),pct=parseFloat(getComputedStyle(el).top),y=pct/100*c.height;ctx.strokeStyle="#fff";ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(c.width,y);ctx.stroke()}measure.photo=c.toDataURL("image/jpeg",.78);if(!measure.value)calculateMeasure();document.getElementById("camStatus").textContent="Foto tersimpan"+(measure.value?" · hasil "+measure.value+" cm":"")}
function fallbackPhoto(inp){let f=inp.files[0];if(!f)return;let r=new FileReader;r.onload=()=>{measure.photo=r.result;document.getElementById("camStatus").textContent="Foto dipilih. Atur dua garis lalu gunakan kalibrasi/ukur."};r.readAsDataURL(f)}function useMeasure(){if(!measure.value)calculateMeasure();if(!measure.value){toast("Kalibrasi lalu hitung terlebih dahulu.");return}let h=document.getElementById("height");if(h){h.value=measure.value;drawMeasure(measure.value)}let p=document.getElementById("preview");if(p&&measure.photo){p.src=measure.photo;p.style.display="block"}closeCam();toast("Hasil ukur dimasukkan ke pengamatan.")}function closeCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}document.getElementById("cam").classList.remove("on")}window.addEventListener("beforeunload",()=>{if(stream)stream.getTracks().forEach(t=>t.stop())});window.addEventListener("pagehide",closeCam);render();
</script></body></html>
